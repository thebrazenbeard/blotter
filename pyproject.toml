[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-blotter"
version = "0.1.0"
description = "Local provenance-aware shared agent activity and knowledge ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "logging", "sqlite", "provenance", "audit"]

[project.scripts]
blotter = "agent_blotter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
